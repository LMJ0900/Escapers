# 로컬 개발용 인프라 (백엔드 명세서 §9.6). `docker compose up -d` 로 기동한다.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: escapers
      POSTGRES_PASSWORD: escapers
      POSTGRES_DB: escapers
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escapers -d escapers"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
